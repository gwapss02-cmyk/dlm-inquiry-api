spring.application.name=java-mail

server.port=8080

# --- SMTP (using Gmail as an example) ---
# Default values keep the app bootable locally; override with real env vars for production use.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:change-me@example.com}
spring.mail.password=${MAIL_APP_PASSWORD:change-me}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Where inquiry notifications should be delivered
inquiry.notify-to=${INQUIRY_NOTIFY_TO:you@yourfirm.com}
